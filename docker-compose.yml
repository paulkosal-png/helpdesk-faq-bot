# docker compose up --build
#   Grafana:    http://localhost:3000  (admin / admin - change it)
#   Prometheus: http://localhost:9090
#   Bot metrics http://localhost:8000/metrics
# No Slack tokens yet? Run with BOT_MODE=simulate to generate demo traffic for the dashboard:
#   BOT_MODE=simulate docker compose up --build
services:
  bot:
    build: .
    command: ["${BOT_MODE:-slack}"]
    env_file:
      - path: .env
        required: false
    environment:
      METRICS_PORT: "8000"
      UNANSWERED_LOG: /app/logs/unanswered.jsonl
    volumes:
      - ./logs:/app/logs
      - ./secrets:/app/secrets:ro   # service-account.json for Google Sheets (optional)
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [bot]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/helpdesk-faq-bot.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped
